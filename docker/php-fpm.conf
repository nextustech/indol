[www]
user = www-data
group = www-data

; PHP-FPM must inherit the container environment so Laravel sees DB_*, APP_KEY, etc.
clear_env = no

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 120